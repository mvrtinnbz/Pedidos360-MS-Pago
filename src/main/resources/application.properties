spring.application.name=ms-pago

# ===============================
# MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3313/pedidos360_pago?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=pedidos360
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# SERVIDOR
# ===============================

server.port=8087
# Muestra el mensaje de error en la respuesta (ej: "La orden ya fue pagada")
server.error.include-message=always

# ===============================
# RABBITMQ (Fase 2: aviso de pago aprobado a ms-orders)
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# ===============================
# ANTIFRAUDE
# Mas de 3 intentos en 10 segundos -> bloqueo
# ===============================

antifraude.max-intentos=3
antifraude.ventana-segundos=10

# Clave secreta para el hash de la tarjeta (en AWS se pasa por variable de entorno)
pagos.hash-secreto=pedidos360-clave-local-cambiar-en-aws

# ===============================
# MS-ORDERS (de aqui se obtiene el monto real de la orden)
# En AWS: variable de entorno ORDENES_API_URL
# ===============================

ordenes.api.url=http://localhost:8084

# ===============================
# WEBPAY PLUS (ambiente de integracion de Transbank)
# URL a la que Webpay devuelve al cliente despues de pagar.
# En AWS: variable de entorno WEBPAY_RETURN_URL (URL del API Gateway)
# ===============================

webpay.return-url=http://localhost:8087/api/pagos/webpay/retorno

# ===============================
# FRONTEND (a donde se redirige al cliente con el resultado del pago)
# En AWS: variable de entorno FRONTEND_URL
# ===============================

frontend.url=http://localhost:4200